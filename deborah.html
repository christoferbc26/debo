<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una pregunta importante 💌</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    text-align:center;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    position:relative;
}

h1{
    color:#e91e63;
}

p{
    color:#555;
}

.buttons{
    margin-top:20px;
}

button{
    padding:10px 25px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin:10px;
    transition:0.3s;
}

#si{
    background:#ff4d6d;
    color:white;
}

#no{
    background:#6c757d;
    color:white;
    position:absolute;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="container" id="pregunta">
    <img src="https://media.tenor.com/i4raNkLQlesAAAAd/もちねこ-ごまぴーち.gif" width="200">
    <h1>¿Puedo ser tu San Valentin? 🥰</h1>
    <p>Eres alguien importante para mi, maldita loka💖</p>

    <div class="buttons">
        <button id="si" onclick="aceptar()">SI 💕</button>
        <button id="no" onmouseover="mover()">NO 😢</button>
    </div>
</div>

<div class="container hidden" id="respuesta">
    <h1>Sabía que dirías que sí 😎💖</h1>
    <p>Prepárate para nuestra cita ✨</p>
</div>

<script>
function mover(){
    var boton = document.getElementById("no");
    var x = Math.random() * 200 - 100;
    var y = Math.random() * 200 - 100;
    boton.style.transform = "translate(" + x + "px," + y + "px)";
}

function aceptar(){
    document.getElementById("pregunta").classList.add("hidden");
    document.getElementById("respuesta").classList.remove("hidden");
}
</script>

</body>
</html>
